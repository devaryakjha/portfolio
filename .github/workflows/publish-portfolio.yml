name: Publish portfolio

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and checks the committed snapshots, so pull requests need no secrets.
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check

  publish:
    needs: check
    # Scheduled and dispatched runs skip the check job; a failed check stops a push from publishing.
    if: ${{ !cancelled() && needs.check.result != 'failure' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: portfolio-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Refresh GitHub activity
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN || github.token }}
        run: bun scripts/refresh-github.mjs
      - run: bun run build
      - run: bun run check
      - name: Publish static files to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
        run: bunx wrangler pages deploy dist --project-name portfolio --branch "$DEPLOYMENT_BRANCH"
